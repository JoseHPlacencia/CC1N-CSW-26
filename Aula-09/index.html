<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
    <table border="1">
        <tbody>
            <tr>
                <td>Nome:</td>
                <td>
                    <input type="text" name="nome_usuario" id="nome_usuario" size="40" maxlength="30" placeholder="Digite seu nome">
                </td> 
            </tr>
            <tr>
                <td>E-mail pessoal:</td>
                <td>
                    <input type="email" id="email" name="email" size="40" maxlength="30" placeholder="Digite seu E-mail pessoal">
                </td> 
            </tr>
            <tr>
                <td>E-mail (patter):</td>
                <td>
                    <input type="email" id="email" name="email" size="40" maxlength="30" placeholder="Digite seu E-mail com @">
                </td> 
            </tr>
            <tr>
                <td>Senha:</td>
                <td>
                    <input type="password" id="senha" name="senha" size="40" maxlength="30" placeholder="Digite sua senha">
                </td> 
            </tr>
            <tr>
                <td>Idade:</td>
                <td>
                    <input type="text" size="40" maxlength="30" placeholder="Digite sua idade">
                </td> 
            </tr>
            <tr>
                <td colspan="2">Deixe um comentário:<br><textarea name="comentário" cols="50" rows="10"></textarea></td>
            </tr>
            <tr>
                <td>
                    <label for="">Matéria de interesse</label><br>
                    <input type="checkbox" name="backend" value="backend"> Backend <br>
                    <input type="checkbox" name="frontend" value="frontend"> FrontEnd <br>
                    <input type="checkbox" name="fullstack" value="frontend"> FullStack <br>
                </td>
                <td>
                    <label for="">Tipo de viagem</label><br>
                    <input type="radio" id="negocios" name="negocios" value="negocios"> Negócios <br>
                    <input type="radio" id="lazer" name="lazer" value="lazer"> Lazer <br>
                    <input type="radio" id="turismo" name="turismo" value="turismo"> Turismo <br>
                    <input type="radio" id="acadmêico" name="acadmêico" value="acadmêico"> Acadêmico <br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Esporte favorito:</label>
                    <select name="esportes" id="esportes" size="4">
                        <option value="futebol">Futebol</option>
                        <option value="Basquete">Basquete</option>
                        <option value="vôlei">Vôlei</option>
                        <option value="tênis">Tênis</option>
                        <option value="">Selecione</option>
                    </select>
                </td>
                <td>
                    <label for="">Investimentos</label>
                    <select name="investimentos" id="investimentos" size="1">

                        <optgroup label="Alto Risco">
                            <option value="investimento_1">Poupança</option>
                            <option value="investimento_2">CDB</option>
                            <option value="investimento_3">Tesouro Direto</option>
                        </optgroup>

                        <optgroup label="Médio Risco">
                            <option value="investimento_4">Fundos Imobiliários</option>
                            <option value="investimento_5">CDI</option>
                            <option value="investimento_6">Debêntures</option>
                        </optgroup>

                        <optgroup label="Baixo Risco">
                            <option value="investimento_7">Criptomoedas</option>
                            <option value="investimento_8">Ações</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">Data e Hora envio: 
                    <input type="datetime-local" name="dtl" id="dtl">
                </td>
            </tr>
            <tr>
                <td>

                </td>
                <td>
                    
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Enviar">
                </td>
                <td>
                    <input type="reset" value="Limpar">
                </td>
            </tr>
        </tbody>
    </table>
    </form>
</body>
</html>
